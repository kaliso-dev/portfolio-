# Déploiement automatique sur Cloudflare à chaque push sur main (site + KALISO + tickets + dashboard).
# Secrets à créer une fois dans GitHub → Settings → Secrets and variables → Actions :
#   CLOUDFLARE_API_TOKEN   jeton Cloudflare (modèle « Edit Cloudflare Workers » + D1 : Edit)
#   CLOUDFLARE_ACCOUNT_ID  identifiant du compte Cloudflare
#   ADMIN_TOKEN            mot de passe du dashboard /admin (au moins 12 caractères)
# Variable facultative (onglet Variables) : SITE_URL, l'adresse finale du site (image d'aperçu).
name: Déployer sur Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
      CF_API: https://api.cloudflare.com/client/v4
      D1_NAME: kaliso-eu   # base de données, placée en Europe de l'Ouest (au plus près des visiteurs)
      D1_REGION: weur
    steps:
      - name: Secrets présents ?
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Secrets Cloudflare absents : déploiement ignoré (voir DEPLOIEMENT.md)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ok == 'true'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ok == 'true'
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        if: steps.check.outputs.ok == 'true'
        with:
          python-version: '3.12'

      - name: Vérifier le jeton Cloudflare
        if: steps.check.outputs.ok == 'true'
        run: |
          curl -fsS "$CF_API/user/tokens/verify" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" > /tmp/verify.json \
            || { echo "::error::Jeton Cloudflare refusé : vérifie CLOUDFLARE_API_TOKEN."; exit 1; }
          python3 -c "import json; d=json.load(open('/tmp/verify.json')); print('jeton :', d['result']['status'])"

      - name: Sous-domaine workers.dev
        if: steps.check.outputs.ok == 'true'
        run: |
          H="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          SUB=$(curl -sS "$CF_API/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" -H "$H" | python3 -c "import sys,json; d=json.load(sys.stdin); print((d.get('result') or {}).get('subdomain') or '')")
          if [ -z "$SUB" ]; then
            for name in lamsouni kaliso-lamsouni sofiene-lamsouni "kaliso-$RANDOM"; do
              R=$(curl -sS -X PUT "$CF_API/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" -H "$H" -H "Content-Type: application/json" --data "{\"subdomain\":\"$name\"}")
              if echo "$R" | grep -q '"success":true'; then SUB=$name; break; fi
            done
          fi
          [ -n "$SUB" ] || { echo "::error::Impossible d'obtenir un sous-domaine workers.dev."; exit 1; }
          echo "sous-domaine : $SUB.workers.dev"

      - name: Installer wrangler
        if: steps.check.outputs.ok == 'true'
        run: npm install --no-save --no-audit --no-fund wrangler@4

      - name: Base D1 (créée au premier passage, en Europe de l'Ouest)
        if: steps.check.outputs.ok == 'true'
        run: |
          H="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          A="$CF_API/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database"
          getid() { curl -sS "$A?name=$1" -H "$H" | python3 -c "import sys,json; n=sys.argv[1]; r=json.load(sys.stdin).get('result') or []; r=[x for x in r if x.get('name')==n]; print(r[0]['uuid'] if r else '')" "$1"; }
          ID=$(getid "$D1_NAME")
          if [ -z "$ID" ]; then
            curl -fsS -X POST "$A" -H "$H" -H "Content-Type: application/json" --data "{\"name\":\"$D1_NAME\",\"primary_location_hint\":\"$D1_REGION\"}" > /dev/null \
              || { echo "::error::Création de la base D1 refusée : ajoute la permission « D1 : Edit » au jeton."; exit 1; }
            ID=$(getid "$D1_NAME")
            # première version de la base (créée aux États-Unis) : on recopie ses données
            OLD=$(getid kaliso)
            if [ -n "$OLD" ]; then
              echo "copie de l'ancienne base « kaliso » vers « $D1_NAME »"
              sed -i "s/^database_name = .*/database_name = \"kaliso\"/; s/^database_id = .*/database_id = \"$OLD\"/" wrangler.toml
              npx wrangler d1 export kaliso --remote --output /tmp/ancienne.sql
              sed -i "s/^database_name = .*/database_name = \"$D1_NAME\"/; s/^database_id = .*/database_id = \"$ID\"/" wrangler.toml
              npx wrangler d1 execute "$D1_NAME" --remote --file /tmp/ancienne.sql
            fi
          fi
          [ -n "$ID" ] || { echo "::error::Base D1 introuvable."; exit 1; }
          sed -i "s/^database_name = .*/database_name = \"$D1_NAME\"/; s/^database_id = .*/database_id = \"$ID\"/" wrangler.toml
          curl -sS "$A/$ID" -H "$H" | python3 -c "import sys,json; r=json.load(sys.stdin).get('result') or {}; print('base D1 :', {k: v for k, v in r.items() if k != 'uuid'})"

      - name: Tables de la base
        if: steps.check.outputs.ok == 'true'
        run: npx wrangler d1 migrations apply "$D1_NAME" --remote

      - name: Construire le site
        if: steps.check.outputs.ok == 'true'
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: python3 build.py

      - name: Déployer
        if: steps.check.outputs.ok == 'true'
        run: |
          set -o pipefail
          npx wrangler deploy 2>&1 | tee deploy.log

      - name: Mot de passe du dashboard
        if: steps.check.outputs.ok == 'true' && env.ADMIN_TOKEN != ''
        run: printf '%s' "$ADMIN_TOKEN" | npx wrangler secret put ADMIN_TOKEN

      - name: Résumé
        if: steps.check.outputs.ok == 'true'
        run: |
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          {
            echo "## ⚔ KALISO est en ligne"
            echo ""
            echo "- Site : $URL"
            echo "- Dashboard : $URL/admin"
            if [ -z "$ADMIN_TOKEN" ]; then echo "- ⚠ Secret ADMIN_TOKEN absent : le dashboard restera fermé."; fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "site : $URL"

      # au lancement manuel seulement (bouton « Run workflow ») : un vrai essai de bout en bout, KALISO compris
      - name: Vérifier en ligne
        if: steps.check.outputs.ok == 'true' && github.event_name == 'workflow_dispatch'
        run: |
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          sleep 8
          echo "--- accueil : $(curl -sS -o /dev/null -w '%{http_code}' "$URL/")"
          echo "--- dashboard : $(curl -sS -o /dev/null -w '%{http_code}' "$URL/admin")"
          echo "--- état de la forge : $(curl -sS "$URL/api/status")"
          echo "--- temps serveur (état) : $(curl -sS -o /dev/null -D - "$URL/api/status" | grep -i server-timing)"
          echo "--- KALISO :"
          curl -sS -X POST "$URL/api/forge" -H "content-type: application/json" \
            --data '{"text":"Test de déploiement : un site vitrine pour un restaurant marocain à Lyon, avec réservation en ligne","lang":"fr"}' \
            | python3 -c "import sys,json; d=json.load(sys.stdin); p=d.get('plan') or {}; print(json.dumps({k: d.get(k) for k in ('ok','model','ms','estimate','error','reason')}, ensure_ascii=False)); print('titre :', p.get('title')); print('résumé :', p.get('summary')); print('fonctionnalités :', p.get('features')); print('stack :', p.get('stack'))"
          echo "--- KALISO en conversation (flux) :"
          curl -sS -N -X POST "$URL/api/chat" -H "content-type: application/json" -D chat.h \
            --data '{"lang":"fr","messages":[{"role":"user","content":"Test de déploiement : je fabrique des bijoux en argent à Fès et je veux les vendre en ligne en Europe"}]}' > chat.sse || true
          grep -i "content-type\|x-model\|server-timing" chat.h || true
          grep -q "^data:" chat.sse || head -c 400 chat.sse; echo
          python3 -c "import json; ev=[json.loads(l[5:]) for l in open('chat.sse',encoding='utf-8') if l.startswith('data:')]; print('morceaux :', sum(1 for e in ev if 't' in e)); print(''.join(e.get('t','') for e in ev)); print('suggestions :', [e.get('chips') for e in ev if e.get('done')]); print([e for e in ev if 'error' in e or 'ok' in e])"
          echo "--- police Google Sans Flex : $(curl -sS -o /dev/null -w '%{http_code}' 'https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@300..600&display=swap')"
