# KALISO — tout le site sur Cloudflare (gratuit) :
#   • les pages du portfolio (dossier dist/, généré par build.py)
#   • l'API : KALISO (Workers AI), les tickets, l'état de la forge
#   • ton dashboard privé : https://<ton-worker>/admin
# Mise en route pas à pas : voir DEPLOIEMENT.md
name = "kaliso"
main = "worker/src/index.js"
compatibility_date = "2026-11-01"

[assets]
directory = "./dist"
binding = "ASSETS"
# seules ces routes réveillent le Worker ; le reste est servi directement (et ne compte pas dans les quotas)
run_worker_first = ["/api/*", "/admin", "/admin/*"]

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "kaliso-eu"
database_id = "REMPLACE-MOI-PAR-L-ID-DONNE-PAR-WRANGLER"
migrations_dir = "worker/migrations"

[vars]
# modèle principal et modèle de secours (Workers AI, offre gratuite : 10 000 neurones / jour)
MODEL = "@cf/mistralai/mistral-small-3.1-24b-instruct"
MODEL_FALLBACK = "@cf/meta/llama-3.1-8b-instruct-fp8-fast"
# garde-fous : au-delà, KALISO répond « la forge refroidit » et propose un ticket
FORGE_DAILY_CAP = "150"   # plans / jour, tous visiteurs confondus (~60 à 110 neurones chacun)
FORGE_PER_HOUR = "6"      # par visiteur
FORGE_PER_DAY = "20"      # par visiteur
TICKETS_PER_HOUR = "4"    # par visiteur
# conversation avec KALISO (chaque message de KALISO coûte ~30 à 70 neurones)
CHAT_PER_HOUR = "40"      # messages par visiteur
CHAT_PER_DAY = "150"      # messages par visiteur
CHAT_MAX_TURNS = "14"     # messages du visiteur par conversation, ensuite : compte rendu
AI_NEURONS_DAY = "9000"   # budget de calcul du jour, conversations + plans (l'offre gratuite en donne 10 000)
# si le site reste sur Netlify (ou ailleurs), mets son adresse ici, séparée par des virgules
ALLOWED_ORIGINS = ""

# ménage quotidien des compteurs anti-abus
[triggers]
crons = ["17 3 * * *"]

# secrets (jamais dans ce fichier) :
#   npx wrangler secret put ADMIN_TOKEN   → le mot de passe de ton dashboard
#   npx wrangler secret put NOTIFY_URL    → optionnel : notification à chaque ticket (ntfy.sh ou webhook Discord)
